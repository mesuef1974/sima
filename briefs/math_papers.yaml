# شرح المنصة للمصمّم الخارجي (طلب المالك 2026-11-13 حين رفض صفحة السكتشات الأولى: «اشرح المنصة بشكل أوضح»)، من واقع المشروع
product: >-
  «أوراق» منصة ويب عربية يفتحها معلم الرياضيات، فيختار درسًا من المنهج القطري للصف الثاني عشر (العلمي والتكنولوجي)،
  ونوع الورقة (ورقة عمل، اختبار قصير، اختبار كامل)، والمستوى (سهل، متوسط، مهارات عليا)، ثم يضغط زرًّا واحدًا فتخرج له
  ورقة جديدة جاهزة للطباعة على A4 مع مفتاح إجابتها، PDF أو Word. كل ضغطة تولّد مسائل مختلفة: الأعداد والمعاملات والرسوم
  البيانية تُحسب آليًّا ولا تُنسخ من كتاب، وكل جواب يُتحقق منه حسابيًّا قبل أن يظهر؛ فيحصل المعلم على نسخ مختلفة متكافئة
  من الورقة نفسها متى شاء، ويحفظ ما ولّده ليعود إليه. جوهرها آلة دقيقة تحوّل المنهج إلى أوراق لا تنتهي، كل ورقة فريدة
  ومضبوطة. ليست بنك أسئلة جاهزة، ولا تطبيق دروس للطلاب، ولا آلة حاسبة: مستخدمها المعلم، وناتجها ورقة مطبوعة في يد الطالب.
audience: معلمو الرياضيات ومنسقو المادة في مدارس قطر؛ يطبعون الأوراق ويوزعونها في الصف
purpose: تحويل منهج محدد إلى ورقة أصلية مطبوعة بضغطة، بمسائل مولَّدة لا منسوخة، بثلاثة مستويات
archetype: Sage أساسي (معرفة ودقة) مع Creator ثانوي (توليد وصناعة)
three_words: [دقة, هدوء, وضوح]

taste:
  feeling: دقة هندسية هادئة، مع إحالة موثقة إلى التراث العلمي العربي وحداثة تقنية بلا ضجيج
  likes: []            # المالك ترك المراجع للنموذج
  dislikes:
    - أيقونات الرياضيات المباشرة (آلة حاسبة، π، مسطرة وقلم، قبعة تخرج، سبورة)
    - التدرجات والظلال والحروف اللامعة
    - المربع المستدير بأيقونة داخله (نمط أيقونة التطبيق العام)
  avoid:
    - نخلة
    - صقر
    - قبة مسجد
    - خنجر
    - هلال زخرفي

