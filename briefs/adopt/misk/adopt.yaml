# بيان اعتماد خارجي لعلامة «مسك» واتجاه هويتها (قرار المالك 2026-11-17: «اعتمد الحزمة كاملة»؛ وفي 2026-11-19 حلّت محلّها حزمته الثانية).
# الحزمة الثانية (D:/misk/brand-identity/approved-2026-11-19، الإصدار 02): شعار شريط جديد تنتهي فيه الكاف بذيل الشريط بعد أن قُرئ الأول «مسكه»،
# ونمط شريط، والألوان والخطّان كما في الأولى. وفي 2026-11-20 (v10) اعتمد المالك الشعار نفسه وربطة الإهداء بعقدة على يمينه، وDESIGN أوسع تباعدًا.
# تدخل الخط كما هي: لا يتغيّر في الأصول إلا اللون، والبصمات أدناه تمنع أي تعديل صامت. بوابتا الاتجاه والدليل تبقيان له.
concept:
  name: «مسك» من شريط هدية
  sentence: الاسم العربي يتحوّل إلى شريط إهداء؛ كلمة «مسك» من طيّات شريط تنتهي كافه بذيل الشريط، و DESIGN أسفلها، وعلى يمينها ربطة إهداء معقودة
  construction: مسار مركّب واحد من 28 حدًّا مغلقًا على لوحة 174.97×47.10؛ الكلمة كما في الحزمة الثانية وحروف DESIGN بأشكالها وأحجامها متباعدة 1.85 حول وسطها، والربطة بارتفاع الشعار كله بعقدة وحلقتين وفاصلين؛ مسارات لا نص حي
wordmark: wordmark.svg   # engraving/misk-approved-engrave-100mm.svg من الحزمة الثانية، وعلى يمينها الربطة بعقدتها، وDESIGN «ج: بعرض الكلمة» (قرار المالك 2026-11-20)
mark: mark.svg           # المعالجة «و: ربطة الإهداء» من Logo Designer (var/misk-rework/small2/misk-icon-f.svg) وفي وسطها عقدة بفاصل 1.5 (طلب المالك 2026-11-20: «وضع العقدة في الربطة»؛ الحلقتان والطيّتان في الشعار وحده لأنها دون 1.5 عند 16)؛ اختارها المالك 2026-11-20 بعد رفضه «ب: الكاف بذيل الشريط» («مرفوض ما هذا الشكل ماذا يعني»)
motif: motif.svg         # assets/ribbon-pattern.svg من الحزمة الثانية بمساراته كما هي؛ اختاره المالك 2026-11-19 بدل نمط Logo Designer، ثم «تحويل نمط الحزمة» (2026-11-20): حُذفت الخلفية العاجية والشفافية 35% ووُسمت الموجات data-tone="accent" لأن الخط لا يقبل غير الأسود
strategy_from: v9        # المنصة الاستراتيجية التي اعتمدها المالك في v9 (2026-11-20) تُنقل ولا يُستدعى النموذج لها
name_check_from: v9      # تحقق الاسم المسجّل في v9
min_mark_px: 16          # حدّ يعلنه المالك للأيقونة (2026-11-20: «16 بكسل وسماكة 1.5»؛ المقيس للربطة 3.12 عند 16). السماكة الافتراضية 1.5 فلا min_stroke_px
min_mark_px_by: owner
min_wordmark_px: 490     # حدّ الشعار الكامل يعلنه المالك (2026-11-20: «490 بكسل» بعد إضافة الربطة، فتبقى الكلمة بحجمها عند 280)؛ دونه الأيقونة
wordmark_color: brand    # قرار المالك 2026-11-20: «العنابي» للشعار كله لا الكلمة بالحبر
min_wordmark_stroke_px: 1.25  # سماكة الشعار الكامل عند 280 من القرار نفسه؛ يُفحص بها الشعار والأيقونة بحدّها 16/1.5
