owner:
  date: "2026-11-20"
  words: '«اعتمد الحزمة كاملة» و«192 بكسل وسماكة 1.25» و«الشعار كاملًا كما هو» (2026-11-17)، ثم في 2026-11-19 «اعتمادها في سِمة» لحزمة approved-2026-11-19 و«نمط الحزمة الجديدة» للنمط، وفي 2026-11-20 «ب: الكاف بذيل الشريط» رمزًا صغيرًا و«16 بكسل وسماكة 1.5» حدًّا له، ثم رفضها («مرفوض ما هذا الشكل ماذا يعني») واختار «و: ربطة الإهداء»، ثم «أريد اعتماده للمنصة والربطة للفافيكون والأيقونات» للشعار بالربطة على يمينه بالعنابي وعقدة في الربطة، و«ج: بعرض الكلمة» لتباعد DESIGN و«490 بكسل» حدًّا للشعار الكامل (2026-11-20)'
direction:
  name: شريط الإهداء
  idea: هوية لاستوديو الهدايا الشخصية تجمع معنى الهدية وأناقة الحرف وخصوصية الاسم المحفور؛ العاجي أساس والعنّابي للمساحات المحددة والشامباني للتفاصيل
  colors:
    paper: "#F8F2E9"     # عاجي: الأربعة الأولى من colors.txt في الحزمة كما هي
    ink: "#35242C"       # فحمي دافئ
    brand: "#68112F"     # عنّابي مسك
    accent: "#D6B68C"    # شامباني: تفاصيل محدودة، لا نص صغير على العاجي
    neutral: "#6C5C61"   # --muted في دليل الحزمة (brand-guide.html)
    success: "#3E6954"   # الأربعة التالية ليست في الحزمة: قيم ألوان الحالات من تسليم Logo Designer في v3؛ يراها المالك في بوابة الاتجاه
    warning: "#8A5A14"
    error: "#B0363F"
    info: "#2D6387"
  accent_informational: false  # الشامباني لمسة تغليف لا تحمل معلومة بلونها (دليل الحزمة)
  type:
    heading: {font: IBMPlexSansArabic-Medium.ttf, weight: 500}   # دليل الحزمة: Medium 500 للعناوين و Regular 400 للنصوص
    body: {font: IBMPlexSansArabic-Regular.ttf, weight: 400}
    numerals: latn       # الحزمة تجعل Manrope للإنجليزية والأرقام المساندة؛ لا خانة لخط لاتيني منفصل في الاتجاه
  motif:
    rule: يُستخدم الشريط الزخرفي باعتدال في التغليف والمنشورات مع مساحة واضحة حول اسم العميل، ولا يوضع خلف النصوص ولا داخل مساحة أمان الشعار
  radius: 2              # قرار المالك 2026-11-17: زوايا 2 كما في تطبيقه (كانت 4 افتراضي الخط)
