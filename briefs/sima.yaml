# موجز علامة «سِمة» نفسها: خط الهوية المحلي ومنصته. يُهشَّر بالكامل (عدا seed) ليكون مفتاح التشغيل.
project: sima
name_ar: سِمة
name_short: سِمة
name_latin: Sima
language: ar
seed: 1

sector: أداة محلية لصناعة الهويات البصرية، خط إنتاج يحوّل موجزًا إلى حزمة هوية معتمدة ومنصة قرار للمالك
audience: مالك واحد يصنع هويات مشاريعه التعليمية والحكومية في قطر، يقرّر من صفحة «اليوم» ويستلم الحزمة في مستودع المشروع
purpose: أن تولد لكل مشروع علامة أصيلة مفحوصة آليًا، بقرار بشري في كل بوابة، وأثر مسجّل لا يُمحى
archetype: Creator أساسي (صناعة وأصالة) مع Ruler ثانوي (نظام وحوكمة وأثر)
three_words: [أثر, صنعة, حكم]

taste:
  feeling: >-
    السِّمة في العربية هي العلامة والأثر الذي يُعرف به الشيء، ومنها الوسم والميسم: الختم الذي يُطبع فيبقى.
    حرفة طابع ومختبر، دقيقة وهادئة، تحترم الورق والحبر؛ ليست شركة تقنية لامعة
  likes: []            # تُترك المراجع للنموذج
  dislikes:
    - الريشة والقلم وفرشاة الرسم ولوح الألوان (كليشيهات أدوات التصميم)
    - الشرارة والعصا السحرية ورموز الذكاء الاصطناعي
    - التدرجات والظلال والحروف اللامعة
    - المربع المستدير بأيقونة داخله
  avoid:
    - نخلة
    - صقر
    - قبة مسجد
    - خنجر
    - هلال زخرفي
    - بصمة إصبع

