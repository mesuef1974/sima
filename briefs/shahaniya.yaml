# موجز علامة «مدرسة الشحانية». قرار المالك 2026-11-15: الشعار للمدرسة نفسها (لا لمنصتها «SchoolOS»)، وعماده التلاعب الاحترافي
# بكلمة «الشحانية» حروفًا لا رمزًا تصويريًا. هذا يتجاوز قيد «لا تمس الشعارات القائمة» الذي بدأ به العمل بإذنه الصريح.
# يُهشَّر بالكامل (عدا seed) ليكون مفتاح التشغيل.
project: shahaniya
name_ar: مدرسة الشحانية
name_short: الشحانية
name_latin: Shahaniya School
language: ar
seed: 1

sector: >-
  مدرسة حكومية في قطر، اسمها الرسمي «الشحانية الإعدادية الثانوية للبنين»، في بلدة الشحانية
product: >-
  «مدرسة الشحانية» مدرسة حكومية للبنين في المرحلتين الإعدادية والثانوية في بلدة الشحانية بدولة قطر. الشعار هو توقيع
  المدرسة نفسها: يُطبع على بوابتها ولوحتها ومراسلاتها الرسمية وشهادات طلابها وزيّها، ويظهر في ترويسة منصتها الرقمية.
  المطلوب علامة كلمة: اسم «الشحانية» بحروفه مصمَّمًا بذكاء، لا رمزًا تصويريًا مرافقًا
audience: >-
  طلاب المرحلتين الإعدادية والثانوية وأولياء أمورهم ومعلمو المدرسة وإدارتها، ومسؤولو وزارة التربية والتعليم الذين يستلمون
  مراسلاتها وتقاريرها الرسمية
purpose: أن يعرف الطالب والمجتمع المحيط المدرسة بكلمة واحدة تُقرأ من بعيد، وتليق بلوحة رسمية وبشهادة طالب وبتقرير مطبوع
archetype: Sage أساسي (علم ورصانة) مع Caregiver ثانوي (رعاية الطلبة)
three_words: [رصانة, انتماء, علم]

taste:
  feeling: >-
    الشحانية بلدة قطرية عريقة، والمدرسة مؤسسة وقورة تخرّج أبناء المجتمع نفسه. علامة كلمة عربية متمكّنة، رصينة وقريبة،
    تُقرأ على جدار وعلى شهادة وعلى ختم؛ ليست شعار شركة تقنية ولا علامة تجارية لامعة
  likes: []
  dislikes:
    - القبعة التخرّجية والكتاب المفتوح والسبورة والقلم الرصاص (كليشيهات التعليم)
    - الرمز التصويري المرافق للاسم: أشخاص وأقواس وأعمدة ومبانٍ
    - الدرع والتاج والشعلة
    - التدرجات والظلال والحروف اللامعة
    - المربع المستدير بأيقونة داخله
  avoid:
    - نخلة
    - صقر
    - قبة مسجد
    - خنجر
    - هلال زخرفي
    - تقليد شعار وزارة التربية والتعليم

# ألوان هوية المدرسة القائمة (الأرجواني القطري والذهبي) تبقى كما هي
