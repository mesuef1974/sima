# قرار المالك 2026-11-16: الشعار يحمل «مسك» بالعربية كبيرة و«DESIGN» باللاتينية صغيرة تحتها.
name_short: مسك
name_latin: Misk Design
language: ar
seed: 1

sector: >-
  استوديو صغير في قطر للحفر والقص بالليزر (xTool P2S) بخطّين: كفرات هواتف من جلد طبيعي نباتي الدباغة محفورة بالاسم،
  وتوزيعات المناسبات بالجملة من خشب وأكريليك (زواج ومهر ومولود واستقبال وختمة قرآن)
product: >-
  «مسك ديزاين» يصمّم ويحفر بالليزر قطعًا شخصية بالاسم. الخط الأول كفر الهاتف من جلد طبيعي نباتي الدباغة موثّق، يُحفر عليه
  اسم صاحبه أو حرفاه بالخط العربي. الخط الثاني توزيعات المناسبات: بطاقات مقوّسة وميداليات أحرف وأغطية برطمانات وعلب من
  خشب أو أكريليك، خمسون إلى ثلاثمئة قطعة بتصميم واحد عليه الاسمان والتاريخ. ومعهما «بورتريه بالقلم»: صورة تُحوَّل إلى
  رسم خطي يُحفر. ما يميّزه عن السوق المحلي اجتماع ثلاثة: خامة طبيعية موثّقة، وحفر ليزر لا طباعة ولا رسم يدوي، واسم بخط
  عربي جميل. ليس مطبعة ولا متجر كفرات مطبوعة ولا يبيع عطورًا ولا حلوى. صيغة الاسم في الشعار: «مسك» بالعربية كبيرة
  و«DESIGN» باللاتينية صغيرة تحتها. المطلوب نوعان في الصفحة الواحدة، نصفها لكل نوع: كلمة «مسك» بخط عربي جميل مرسوم
  فيها حيلة تقول الحفر أو الاسم المحفور أو الهدية، ورمز يفهم منه من يراه نشاط الاستوديو ومعه الاسم. سؤال صاحب العلامة
  الذي يُحكم به على كل سكتش بنصّه: «من يقرأ هذا الشعار ماذا يفهم؟». يصلح أن يُحفر بالليزر بلون واحد بلا تدرجات على جلد
  وخشب وأكريليك
audience: >-
  أفراد في قطر يريدون كفرًا جلديًّا فاخرًا باسمهم أو هدية شخصية، وعرائس وأمهات وعائلات تجهّز توزيعات مناسبة بالعشرات
  والمئات، ومنظّمو مناسبات ومعارض هدايا في الدوحة
purpose: >-
  أن يُعرف الاستوديو من اسمه محفورًا على القطعة نفسها وعلى بطاقتها وعبوتها وفي حسابه على إنستغرام، وأن يوحي بدقة التصميم
  وجمال الخط العربي وصدق الخامة الطبيعية، بفخامة هادئة
archetype: Creator أساسي (تصميم وحرفة وإتقان) مع Lover ثانوي (أناقة وإحساس بالمناسبة)
three_words: [دقة, دفء, أناقة]

taste:
  feeling: >-
    «مسك» عطر خليجي يوحي بالهدية والمناسبة، و«ديزاين» استوديو تصميم: علامة عربية أنيقة دافئة فيها روح، فيها جمال الخط
    ودقّة الليزر معًا؛ فاخرة هادئة لا مبهرجة، يفهم قارئها ما يصنعه الاستوديو، وتُقرأ محفورة على كفر جلد وعلى بطاقة خشب
    صغيرة وعلى علبة هدية
  likes: []
  dislikes:
    - زجاجة العطر والدخان والبخور والمبخرة (كليشيهات الاسم)
    - الإطار الزخرفي والأرابيسك الثقيل
    - التدرجات والظلال والحروف اللامعة والتأثيرات المعدنية
    - شعار شركة تقنية أو متجر إلكتروني عام
    # ما رفضه المالك 2026-11-16 من صفحة سكتشات ChatGPT ومن اتجاهات Logo Designer الثلاثة، بنصّه:
    - خطوط رفيعة متشابهة بلا فكرة
    - كلمة آلية بلا روح مرسومة هندسيًّا كخط شاشة رقمية
    - شعار لا فكرة ذكية فيه ولا فخامة ولا دفء
    - ميم منفردة ختمًا تُقرأ حرفًا لاتينيًّا، ورمز مجرد عام لا صلة له بالاسم ولا بالنشاط
  avoid:
    - نخلة
    - صقر
    - قبة مسجد
    - خنجر
    - هلال زخرفي
    - دلة قهوة

