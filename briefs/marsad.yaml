# موجز علامة «مرصد الجهاز». طلب المالك 2026-11-18: هوية بصرية كاملة من البداية إلى النهاية.
# قرارات المالك في الجلسة: شعار جديد كليًا يحلّ محلّ القائم (assets/logo_*.svg وicon.svg)، مصمّم خارجي (ChatGPT)،
# والإبقاء على الفيروزي والجرافيت الدافئ (web/css/tokens.css)، والتسليم بطاقةً لمشغّل المستودع بعد اعتماد الدليل.
# القطاع والمنتج والجمهور من README المشروع وCLAUDE.md وواجهته؛ روح العلامة اقتراح يُراجَع في بوابة المنصة الاستراتيجية.
# السكتشات نوعان كما انتهى إليه «مسك»: كلمة بحيلة، ورمز يشرح النشاط مع الاسم.
# يُهشَّر بالكامل (عدا seed) ليكون مفتاح التشغيل.
project: marsad
name_ar: مرصد الجهاز
name_short: مرصد
name_latin: Marsad
language: ar
seed: 1

sector: >-
  أداة شخصية محلية على ويندوز لمراقبة صحة الحاسوب وتنظيفه: المعالج والذاكرة والقرص والبطارية والإقلاع والأعطال
product: >-
  «مرصد الجهاز» ويدجت صغيرة على سطح المكتب وتطبيق محلي (خادم على 127.0.0.1 وواجهة عربية) يرصد الجهاز لحظةً بلحظة:
  استهلاك المعالج والذاكرة والقرص، وحرارة البطارية، وزمن الإقلاع، والأعطال وسجلاتها، ويقترح التنظيف ويحجر قبل الحذف.
  الشعار يظهر في الويدجت بحجم صغير جدًا، وفي شريط المهام وصينية النظام (16 و24 بكسل)، وفي ترويسة التطبيق، واختصارات
  سطح المكتب وقائمة ابدأ. المطلوب علامة تُقرأ في الصينية بحجم 16، وتوحي بالرصد الهادئ اليقظ لا بالإنذار
audience: >-
  مالك الجهاز نفسه وأمثاله من المستخدمين المتمكّنين الذين يريدون رؤية حال حاسوبهم بالعربية ودون برامج تجارية مزعجة
purpose: >-
  أن يعرف المستخدم بنظرة واحدة أن جهازه مرصود ومطمئن، وأن تُعرف الأداة من أيقونتها في الصينية وسط أيقونات النظام
archetype: Sage أساسي (فهم ورؤية) مع Caregiver ثانوي (حراسة وطمأنينة)
three_words: [يقظة, وضوح, طمأنينة]

taste:
  feeling: >-
    مرصد هادئ يرى ما لا يُرى: علامة دقيقة واضحة، تقنية دون برود، عربية دون زخرف؛ تصلح أيقونة صغيرة على خلفية داكنة
    وفاتحة، وتُقرأ في ترويسة تطبيق بجانب أرقام ومؤشرات
  likes: []
  dislikes:
    - مقياس السرعة والعدّاد ونبض القلب وموجة تخطيط القلب (كليشيهات المراقبة)
    - الدرع والقفل والمكنسة وسلة المهملات
    - شريحة المعالج ولوحة الدوائر والترس
    - العين المفتوحة الحرفية والمنظار والتلسكوب
    - التدرجات والظلال والتوهج والحروف اللامعة
  avoid:
    - نخلة
    - صقر
    - قبة مسجد
    - خنجر
    - هلال زخرفي

